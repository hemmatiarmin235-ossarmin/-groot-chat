/* GROOT CHAT mobile-first glass refinement */
:root{
 --bg:#090711;--panel:rgba(24,18,39,.66);--panel2:rgba(35,26,54,.58);
 --line:rgba(202,174,255,.16);--text:#f8f4ff;--muted:#b7abc9;
 --purple:#9a70ff;--pink:#d16de5;--glass:rgba(26,19,43,.62);
}
html,body{width:100%;max-width:100%;min-width:0;height:100%;margin:0;overflow:hidden}
body{
 background:radial-gradient(ellipse at 12% 4%,rgba(125,72,207,.25),transparent 36%),
 radial-gradient(ellipse at 92% 88%,rgba(180,67,180,.14),transparent 34%),#090711;
 background-attachment:fixed;overscroll-behavior:none;
}
button,input,textarea{min-width:0;max-width:100%}
.auth{min-height:100dvh;height:100dvh;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow:auto}
.authbox,.rail,.side,.main,.modal,.card,.notice,.toast{
 background:var(--glass)!important;border:1px solid var(--line)!important;
 -webkit-backdrop-filter:blur(24px) saturate(155%);backdrop-filter:blur(24px) saturate(155%);
 box-shadow:0 18px 55px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.055);
}
.authbox{width:min(430px,100%);border-radius:28px;padding:clamp(20px,5vw,32px)}
.app{width:100%;max-width:100vw;height:100dvh;min-height:0;min-width:0;overflow:hidden;
 display:grid;grid-template-columns:68px minmax(245px,310px) minmax(0,1fr);gap:10px;
 padding:10px; padding-top:max(10px,env(safe-area-inset-top));
 padding-bottom:max(10px,env(safe-area-inset-bottom));
}
.rail,.side,.main{min-width:0;min-height:0;border-radius:22px;overflow:hidden}
.rail{background:rgba(25,18,42,.56)!important}
.side{background:rgba(23,17,38,.62)!important}
.main{background:rgba(19,14,32,.56)!important}
.sidehead,.mainhead,.composer{border-color:var(--line)!important;background:rgba(255,255,255,.018)}
.sidebody,.messages,.panel{min-width:0;min-height:0;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(177,139,255,.32) transparent}
.item{max-width:100%;min-width:0}
.item:hover,.item.selected,.navbtn.active{background:rgba(139,93,220,.22)!important;border-color:rgba(190,153,255,.25)!important}
.iconbtn{background:rgba(255,255,255,.055)!important;border-color:var(--line)!important}
input,textarea{background:rgba(7,5,14,.48)!important;border-color:var(--line)!important;min-width:0}
.btn{box-shadow:0 7px 22px rgba(129,78,222,.2)}
.bubble{max-width:min(78%,620px);overflow-wrap:anywhere;word-break:break-word;background:rgba(77,61,103,.42)!important;border-color:rgba(207,182,255,.15)!important;backdrop-filter:blur(12px)}
.bubble.mine{background:linear-gradient(135deg,rgba(111,73,185,.82),rgba(153,70,169,.78))!important}
.card{background:rgba(38,28,57,.52)!important}
.modalback{padding:clamp(10px,3vw,22px);padding-bottom:max(10px,env(safe-area-inset-bottom));background:rgba(3,2,8,.68);backdrop-filter:blur(9px)}
.modal{width:min(540px,100%);max-height:min(88dvh,850px);border-radius:24px;padding:clamp(14px,4vw,22px);overflow-x:hidden}
.toast{bottom:max(16px,env(safe-area-inset-bottom));max-width:calc(100vw - 28px);white-space:normal}
/* Prevent flex/grid children from forcing horizontal overflow */
.app>* , .main>* , .side>* , .modal>*{min-width:0;max-width:100%}
@media(max-width:850px){
 .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:8px;padding:7px;
  padding-top:max(7px,env(safe-area-inset-top));padding-bottom:max(7px,env(safe-area-inset-bottom));}
 .rail{grid-column:1;grid-row:2;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  width:100%;height:64px;min-height:64px;padding:5px 8px;gap:5px;border-radius:20px;}
 .rail::-webkit-scrollbar{display:none}
 .rail .logo{display:none}
 .navbtn{width:auto;min-width:68px;min-height:50px;max-height:54px;flex:0 0 auto;padding:4px 8px;border-radius:14px;font-size:10px;line-height:1.25}
 .navbtn span:first-child{font-size:19px}
 .side{grid-column:1;grid-row:1;display:none;width:100%;height:100%;border-radius:22px}
 .main{grid-column:1;grid-row:1;display:flex;width:100%;height:100%;border-radius:22px}
 .app[data-view="list"] .side{display:flex}
 .app[data-view="list"] .main{display:none}
 .app[data-view="list"] .rail{display:none}
 .app[data-view="chat"] .side{display:none}
 .app[data-view="chat"] .main{display:flex}
 .app[data-view="contacts"] .side,.app[data-view="profile"] .side,.app[data-view="settings"] .side{display:none}
 .app[data-view="contacts"] .main,.app[data-view="profile"] .main,.app[data-view="settings"] .main{display:flex}
 .mainhead{min-height:64px;padding:10px 12px}
 .messages{padding:12px 10px;gap:8px}
 .bubble{max-width:88%;padding:9px 11px}
 .composer{padding:9px;gap:7px;padding-bottom:max(9px,env(safe-area-inset-bottom))}
 .composer textarea{min-height:43px;max-height:112px;font-size:14px}
 .composer .send{min-width:44px;height:43px;padding:8px}
 .sidehead{padding:12px}
 .sidebody{padding:9px}
 .modal{max-height:calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
 .split{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:380px){
 .app{padding:5px;gap:6px}
 .rail{height:60px;min-height:60px;padding:4px}
 .navbtn{font-size:9px}
 .sidehead h2,.mainhead h2{font-size:15px}
 .avatar{width:38px;height:38px;border-radius:12px}
 .item{padding:9px;gap:8px}
 .composer{padding:7px}
}
@media(max-height:560px) and (max-width:850px){
 .rail{height:54px;min-height:54px}
 .mainhead{min-height:54px}
 .messages{padding:8px}
}
@media(prefers-reduced-motion:no-preference){
 .rail,.side,.main,.modal,.authbox{animation:glassIn .22s ease-out}
 .item,.iconbtn,.navbtn,.btn{transition:background .18s ease,border-color .18s ease,transform .18s ease}
 .iconbtn:active,.navbtn:active,.btn:active{transform:scale(.97)}
}
@keyframes glassIn{from{opacity:.86;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

async function api(path,options={}){
 const method=String(options.method||'GET').toUpperCase();
 const isPublicAuth=(path==='/api/login'||path==='/api/register')&&method==='POST'&&!state.token;
 const headers={...(options.body?{'Content-Type':isPublicAuth?'text/plain;charset=UTF-8':'application/json'}:{}),...(!isPublicAuth&&state.token?{Authorization:'Bearer '+state.token}:{})};
 let r;

  r=await fetch(API+path,{method,headers,body:options.body?JSON.stringify(options.body):undefined,mode:'cors',credentials:'omit',cache:'no-store',redirect:'follow'});
 }catch(err){
  const e=new Error('اتصال به سرور برقرار نشد. اینترنت، آدرس سایت و دسترسی مرورگر به Cloudflare را بررسی کن. ('+(err&&err.message?err.message:'NetworkError')+')');
  e.network=true;throw e;
 }
 let d={};const raw=await r.text();if(raw){try{d=JSON.parse(raw)}catch{d={detail:raw.slice(0,240)}}}
 if(!r.ok){const e=new Error(d.error||d.message||d.detail||('خطای سرور '+r.status));e.status=r.status;throw e}
 return d;
}

function initAppHistory(){

  const url=location.pathname+location.search+'#groot-chat';
  history.replaceState({grootApp:true,grootGuard:true},'',url);
  history.pushState({grootApp:true,grootGuard:true},'',url);
 }catch{}
}
function backInApp(){
 if($('#modalRoot').innerHTML.trim()){closeModal();return}
 const current=$('#app').dataset.view||'list';
 if(appViewStack.length>1){

  $('#profileSettings').onclick=()=>view('settings');
  $('#saveProfile').onclick=async()=>{try{await api('/api/profile',{method:'PATCH',body:{display_name:$('#displayName').value,bio:$('#bio').value}});toast('پروفایل ذخیره شد');showProfile()}catch(e){toast(e.message)}};
  $('#profileMore').onclick=()=>{modal('گزینه‌های پروفایل',`<button class="item" id="profileEditMenu">ویرایش اطلاعات</button><button class="item" id="profileSettingsMenu">تنظیمات حساب</button>`);$('#profileEditMenu').onclick=()=>{closeModal();$('#profileEditor').classList.remove('hidden');$('#profileEditor').scrollIntoView({behavior:'smooth',block:'center'})};$('#profileSettingsMenu').onclick=()=>{closeModal();view('settings')}};
  $('#profileSearch').onclick=()=>{view('list');setTimeout(()=>$('#chatSearch').focus(),80)};
 }catch(e){toast(e.message)}
}
function showNotes(){
 $('#mainTitle').textContent='GROOT NOTES';$('#mainSub').textContent='یادداشت‌های ذخیره‌شده روی این دستگاه';$('#composer').classList.add('hidden');$('#groupInfo').hidden=true;
 const render=()=>{const q=($('#noteSearch')?.value||'').trim().toLowerCase();const list=state.notes.filter(n=>(n.title+' '+n.body).toLowerCase().includes(q));$('#notesList').innerHTML=list.length?list.map(n=>`<article class="card" data-note="${esc(n.id)}"><div class="row" style="justify-content:space-between"><b>${esc(n.title||'بدون عنوان')}</b><button class="iconbtn" data-del-note="${esc(n.id)}" title="حذف">✕</button></div><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(n.body)}</p><small class="muted">${new Date(n.updated).toLocaleString('fa-IR')}</small><button class="btn secondary" data-edit-note="${esc(n.id)}" style="margin-right:8px">ویرایش</button></article>`).join(''):'<div class="empty">یادداشتی وجود ندارد.</div>';document.querySelectorAll('[data-del-note]').forEach(b=>b.onclick=()=>{state.notes=state.notes.filter(n=>n.id!==b.dataset.delNote);saveNotes();render()});document.querySelectorAll('[data-edit-note]').forEach(b=>b.onclick=()=>editNote(b.dataset.editNote))};
 $('#mainContent').innerHTML=`<div class="panel"><div class="row"><input id="noteSearch" placeholder="جست‌وجوی یادداشت‌ها"><button class="btn" id="addNote">یادداشت جدید +</button></div><div class="notice">این نسخه یادداشت‌ها را فعلاً فقط روی همین دستگاه نگه می‌دارد؛ همگام‌سازی ابری تا اضافه‌شدن API یادداشت‌ها فعال نیست.</div><div id="notesList"></div></div>`;
 $('#noteSearch').oninput=render;$('#addNote').onclick=()=>editNote(null);render();
}
function saveNotes(){localStorage.setItem('groot.notes',JSON.stringify(state.notes))}
function editNote(id){const n=state.notes.find(x=>x.id===id)||{title:'',body:''};modal(id?'ویرایش یادداشت':'یادداشت جدید',`<label class="field">عنوان<input id="noteTitle" maxlength="100" value="${esc(n.title)}"></label><label class="field">متن یادداشت<textarea id="noteBody" rows="8" maxlength="20000">${esc(n.body)}</textarea></label><button class="btn" id="saveNote">ذخیره</button>`);$('#saveNote').onclick=()=>{const title=$('#noteTitle').value.trim(),body=$('#noteBody').value.trim();if(!title&&!body){toast('یادداشت خالی ذخیره نمی‌شود');return}if(id){Object.assign(n,{title,body,updated:Date.now()})}else{state.notes.unshift({id:crypto.randomUUID(),title,body,updated:Date.now()})}saveNotes();closeModal();showNotes();toast('یادداشت روی این دستگاه ذخیره شد')}}
function showSpace(){$('#mainTitle').textContent='GROOT SPACE';$('#mainSub').textContent='فضای ذخیره‌سازی شخصی';$('#composer').classList.add('hidden');$('#groupInfo').hidden=true;$('#mainContent').innerHTML=`<div class="panel"><div class="card"><h3>فضای فایل‌های شخصی</h3><p class="muted">معماری ذخیره‌سازی این بخش با Cloudflare R2 طراحی شده است.</p><div class="notice">R2 هنوز روی حساب Cloudflare فعال نشده است؛ درخواست ساخت Bucket با خطای فعال‌سازی R2 برگشت. بنابراین فعلاً آپلود و دانلود ابری را فعال نمی‌کنم تا دکمه‌های نمایشی و بی‌استفاده تحویلت ندهم.</div></div><div class="card"><h3>قابلیت‌های در صف اتصال</h3><ul><li>آپلود عکس، ویدیو، صوت و اسناد</li><li>ساخت پوشه و دسته‌بندی فایل‌ها</li><li>تغییر نام، جابه‌جایی و حذف</li><li>جست‌وجو و دانلود امن</li><li>نمایش حجم مصرف‌شده و ظرفیت باقی‌مانده</li></ul></div></div>`}
function showSettings(){
 $('#mainTitle').textContent='تنظیمات';$('#mainSub').textContent='مدیریت حساب و برنامه';$('#composer').classList.add('hidden');$('#groupInfo').hidden=true;
 const rows=[
  ['◉','حساب کاربری','شماره، نام کاربری، بیوگرافی','profile','blue'],
  ['☷','تنظیمات گفتگو','پس‌زمینه، حالت شب، انیمیشن‌ها','chatprefs','orange'],
  ['⚿','حریم خصوصی و امنیت','آخرین بازدید، دستگاه‌ها، کلیدهای عبور','security','green'],
  ['◖','اعلان‌ها','صداها، تماس‌ها، نشانگرها','notifications','red'],
  ['◧','داده‌ها و ذخیره‌سازی','تنظیمات دانلود رسانه','storage','indigo'],
  ['▰','پوشه‌های گفتگو','مرتب‌سازی گفتگوها در پوشه‌ها','folders','cyan'],
  ['▣','دستگاه‌ها','مدیریت دستگاه‌های متصل','devices','teal'],
  ['▤','GROOT SPACE','فضای ذخیره‌سازی شخصی','space','blue'],
  ['▧','GROOT NOTES','دفترچه یادداشت','notes','purple'],
  ['文','زبان','زبان رابط کاربری','language','violet']
 ];
 $('#mainContent').innerHTML=`<div class="settings-page"><div class="settings-topbar"><span class="topbar-qr">▦</span><b>تنظیمات</b><button class="top-icon" id="settingsMore">⋮</button></div><div class="settings-account-head"><div class="settings-account-avatar">${esc(Array.from((state.user?.username||'G'))[0]||'G')}</div><div><b>${esc(state.user?.display_name||state.user?.username||'حساب کاربری')}</b><small dir="ltr">@${esc(state.user?.username||'')}</small></div></div><div class="settings-card">${rows.map(([ic,title,desc,key,color])=>`<button class="setting-item" data-setting="${key}"><span class="setting-icon ${color}">${ic}</span><span class="setting-copy"><b>${title}</b><small>${desc}</small></span><span class="setting-chevron">‹</span></button>`).join('')}</div><div class="settings-bottom"><button class="logout-row" id="logoutBtn">خروج از حساب</button><small>GROOT CHAT · نسخه آزمایشی</small></div></div>`;
 $('#logoutBtn').onclick=logout;$('#settingsMore').onclick=()=>modal('تنظیمات',`<p class="muted">مدیریت تنظیمات حساب و برنامه</p><button class="item" id="settingsLogout">خروج از حساب</button>`);setTimeout(()=>{const b=$('#settingsLogout');if(b)b.onclick=()=>{closeModal();logout()}},0);
 document.querySelectorAll('[data-setting]').forEach(b=>b.onclick=()=>{
  const key=b.dataset.setting;
  if(key==='profile')return view('profile');
  if(key==='space')return view('space');
  if(key==='notes')return view('notes');
  if(key==='chatprefs')return openAppearanceSettings();
  if(key==='security'||key==='devices')return toast('مدیریت نشست‌ها و دستگاه‌ها هنوز به API نیاز دارد');
  if(key==='notifications')return toast('تنظیمات اعلان‌ها در مرحله بعد اضافه می‌شود');
  if(key==='storage')return view('space');
  if(key==='folders')return toast('مدیریت پوشه‌های گفتگو هنوز پیاده‌سازی نشده است');
  if(key==='language')return toast('فعلاً زبان فارسی فعال است');
 });
}
function openAppearanceSettings(){
 const a=appearance;
 modal('شخصی‌سازی ظاهر',`<div class="settings-modal appearance-controls">
  <label class="field">رنگ اصلی رابط<select id="accent"><option value="#2799dc">آبی</option><option value="#8b5cf6">بنفش</option><option value="#31a66b">سبز</option><option value="#e36a86">صورتی</option><option value="#e39a32">نارنجی</option><option value="#202a44">سرمه‌ای</option></select></label>
  <label class="field">حالت نمایش<select id="themeMode"><option value="light">روشن</option><option value="dark">تیره</option></select></label>
  <label class="field">پس‌زمینه برنامه<select id="wallpaper"><option value="plain">خاکستری روشن</option><option value="sky">آبی ملایم</option><option value="lavender">یاسی</option><option value="mint">سبز ملایم</option></select></label>
  <label class="field range-field"><span>شفافیت پنل‌ها <b id="opacityValue"></b></span><input id="glassOpacity" type="range" min="30" max="95" step="5"></label>
  <label class="field range-field"><span>شدت محوشدگی شیشه <b id="blurValue"></b></span><input id="glassBlur" type="range" min="6" max="40" step="2"></label>
  <label class="field range-field"><span>اندازه نوشته <b id="fontValue"></b></span><input id="fontSize" type="range" min="12" max="19" step="1"></label>
  <label class="field range-field"><span>گردی گوشه‌ها <b id="radiusValue"></b></span><input id="cornerRadius" type="range" min="12" max="34" step="2"></label>
  <label class="field">تراکم رابط<select id="density"><option value="normal">معمولی</option><option value="compact">فشرده</option></select></label>
  <label class="checkrow">انیمیشن‌های رابط فعال باشند<input id="motion" type="checkbox" checked></label>
  <div class="appearance-preview"><span>پیش‌نمایش</span><div class="preview-glass">GROOT CHAT <small>پنل شیشه‌ای</small></div></div>
  <button class="btn" id="saveAppearance">ذخیره شخصی‌سازی</button>
 </div>`);
 $('#accent').value=a.accent;$('#themeMode').value=a.theme;$('#wallpaper').value=a.wallpaper;$('#glassOpacity').value=a.opacity;$('#glassBlur').value=a.blur;$('#fontSize').value=a.font;$('#cornerRadius').value=a.radius;$('#density').value=a.density;$('#motion').checked=a.motion!==false;
 const updateLabels=()=>{$('#opacityValue').textContent=$('#glassOpacity').value+'٪';$('#blurValue').textContent=$('#glassBlur').value+'px';$('#fontValue').textContent=$('#fontSize').value+'px';$('#radiusValue').textContent=$('#cornerRadius').value+'px'};
 ['glassOpacity','glassBlur','fontSize','cornerRadius'].forEach(id=>$('#'+id).oninput=updateLabels);updateLabels();
 $('#saveAppearance').onclick=()=>{
  appearance={accent:$('#accent').value,theme:$('#themeMode').value,wallpaper:$('#wallpaper').value,opacity:+$('#glassOpacity').value,blur:+$('#glassBlur').value,font:+$('#fontSize').value,radius:+$('#cornerRadius').value,density:$('#density').value,motion:$('#motion').checked};
  applyAppearance();closeModal();toast('شخصی‌سازی ذخیره شد');
 };
}

function logout(){clearInterval(state.poll);try{api('/api/logout',{method:'POST'})}catch{}state.token='';state.user=null;state.active=null;appHistoryReady=false;localStorage.removeItem('groot.token');$('#modalRoot').innerHTML='';$('#app').classList.add('hidden');$('#auth').classList.remove('hidden');authMode('login');try{history.replaceState(null,'',location.pathname+location.search)}catch{}}
$('#app').addEventListener('click',e=>{if(e.target.closest('[data-view="list"]')){}});
(async()=>{if(state.token){try{await startApp()}catch(e){localStorage.removeItem('groot.token');state.token='';$('#auth').classList.remove('hidden');$('#app').classList.add('hidden')}}})();
</script>
</body></html>
