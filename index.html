
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GROOT CHAT</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090812;color:#fff;
 font-family:Tahoma,Arial,sans-serif;
 min-height:100vh;
}
:root{--purple:#925cff;--panel:#151321;--border:#292438}
header{
 height:65px;display:flex;align-items:center;
 justify-content:space-between;padding:0 20px;
 border-bottom:1px solid var(--border);
 background:#100e1a;
}
.logo{font-size:22px;font-weight:bold;color:#b18aff}
.logo span{color:white}
button{
 border:0;border-radius:10px;padding:12px 17px;
 background:var(--purple);color:white;font-weight:bold;
 cursor:pointer;
}
button:disabled{opacity:.5}
input{
 width:100%;padding:14px;margin:8px 0;
 border:1px solid var(--border);border-radius:10px;
 background:#0e0c17;color:white;outline:none;
}
input:focus{border-color:var(--purple)}
.container{max-width:900px;margin:auto;padding:20px}
.panel{
 background:var(--panel);border:1px solid var(--border);
 border-radius:16px;padding:20px;
}
.hidden{display:none!important}
h2{margin-top:0}
.muted{color:#9691a6;font-size:13px}
.tabs{display:flex;gap:10px;margin-bottom:15px}
.tabs button{flex:1}
.tabs .active{background:#5935a0}
.auth{max-width:420px;margin:70px auto}
#messages{
 height:55vh;overflow-y:auto;padding:12px;
 display:flex;flex-direction:column;gap:12px;
}
.msg{
 max-width:80%;padding:12px 15px;
 border-radius:14px;background:#272237;
 align-self:flex-start;overflow-wrap:anywhere;
}
.msg.mine{align-self:flex-end;background:#5935a0}
.msg small{display:block;color:#d1baff;font-size:11px;margin-bottom:6px}
.composer{display:flex;gap:8px}
.composer input{margin:0}
.status{font-size:12px;color:#aaa;margin:10px 0}
@media(max-width:550px){
 .container{padding:12px}
 .auth{margin:45px auto}
 #messages{height:58vh}
 header{padding:0 12px}
}
</style>
</head>
<body>

<header>
 <div class="logo">GROOT <span>CHAT</span></div>
 <button id="logout" class="hidden" onclick="logout()">خروج</button>
</header>

<div class="container">

<section id="auth" class="panel auth">
 <h2>خوش اومدی 💜</h2>
 <p class="muted">به دنیای GROOT CHAT وارد شو</p>

 <div class="tabs">
  <button id="loginTab" class="active" onclick="setMode('login')">ورود</button>
  <button id="registerTab" onclick="setMode('register')">ثبت‌نام</button>
 </div>

 <input id="username" placeholder="نام کاربری" maxlength="30">
 <input id="password" type="password" placeholder="رمز عبور">
 <button id="authButton" style="width:100%" onclick="authenticate()">ورود به حساب</button>
 <p id="authStatus" class="status"></p>
</section>

<section id="chat" class="panel hidden">
 <h2>گفت‌وگوی عمومی</h2>
 <p class="muted">پیام‌ها برای کاربران واردشده قابل مشاهده‌اند.</p>
 <div id="messages"></div>
 <div class="composer">
  <input id="messageInput" placeholder="پیامت رو بنویس..." maxlength="2000">
  <button onclick="sendMessage()">ارسال</button>
 </div>
 <p id="chatStatus" class="status"></p>
</section>

</div>

<script>
const API="https://groot-chat-api.hemmatiarmin235.workers.dev";

let mode="login";
let token=localStorage.getItem("groot_token");
let currentUser=localStorage.getItem("groot_username");
let timer=null;

const $=id=>document.getElementById(id);

function setMode(value){
 mode=value;
 $("loginTab").classList.toggle("active",mode==="login");
 $("registerTab").classList.toggle("active",mode==="register");
 $("authButton").textContent=mode==="login"?"ورود به حساب":"ساخت حساب";
 $("authStatus").textContent="";
}

async function api(path,options={}){
 const response=await fetch(API+path,{
  ...options,
  headers:{
   "Content-Type":"application/json",
   ...(token?{"Authorization":"Bearer "+token}:{}),
   ...options.headers
  }
 });
 const data=await response.json();
 if(!response.ok)throw new Error(data.error||"خطای سرور");
 return data;
}

async function authenticate(){
 const username=$("username").value.trim();
 const password=$("password").value;

 if(username.length<3||password.length<8){
  $("authStatus").textContent="نام کاربری حداقل ۳ و رمز حداقل ۸ کاراکتر باشد.";
  return;
 }

 $("authButton").disabled=true;
 $("authStatus").textContent="در حال اتصال...";

 try{
  const data=await api(mode==="login"?"/api/login":"/api/register",{
   method:"POST",
   body:JSON.stringify({username,password})
  });

  if(mode==="register"){
   $("authStatus").textContent="حساب ساخته شد. حالا وارد شو.";
   setMode("login");
   return;
  }

  token=data.token;
  currentUser=data.user.username;
  localStorage.setItem("groot_token",token);
  localStorage.setItem("groot_username",currentUser);
  showChat();

 }catch(error){
  $("authStatus").textContent=error.message;
 }finally{
  $("authButton").disabled=false;
 }
}

function showChat(){
 $("auth").classList.add("hidden");
 $("chat").classList.remove("hidden");
 $("logout").classList.remove("hidden");
 loadMessages();
 timer=setInterval(loadMessages,4000);
}

function logout(){
 clearInterval(timer);
 token=null;
 currentUser=null;
 localStorage.removeItem("groot_token");
 localStorage.removeItem("groot_username");
 $("chat").classList.add("hidden");
 $("logout").classList.add("hidden");
 $("auth").classList.remove("hidden");
 $("messages").innerHTML="";
}

async function loadMessages(){
 try{
  const data=await api("/api/messages");
  const box=$("messages");
  const oldCount=box.children.length;
  const oldLast=box.lastElementChild?.dataset.id;

  if(oldCount===data.messages.length &&
     oldLast===data.messages[data.messages.length-1]?.id)return;

  box.innerHTML="";

  data.messages.forEach(message=>{
   const item=document.createElement("div");
   item.className="msg"+(message.username===currentUser?" mine":"");
   item.dataset.id=message.id;

   const name=document.createElement("small");
   name.textContent=message.username;

   const content=document.createElement("div");
   content.textContent=message.content;

   item.append(name,content);
   box.appendChild(item);
  });

  box.scrollTop=box.scrollHeight;
  $("chatStatus").textContent="متصل";
 }catch(error){
  $("chatStatus").textContent=error.message;
 }
}

async function sendMessage(){
 const input=$("messageInput");
 const content=input.value.trim();
 if(!content)return;

 input.disabled=true;

 try{
  await api("/api/messages",{
   method:"POST",
   body:JSON.stringify({content})
  });
  input.value="";
  await loadMessages();
 }catch(error){
  $("chatStatus").textContent=error.message;
 }finally{
  input.disabled=false;
  input.focus();
 }
}

$("messageInput").addEventListener("keydown",event=>{
 if(event.key==="Enter")sendMessage();
});

if(token){
 showChat();
}
</script>

</body>
</html>
